<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline Element</title>
</head>

<body>
    <!--Block and Inline Element-->
    <div>
        <mark>Block 1</mark>
        <br>
        <br>
        <mark>Block 2</mark>

    </div>
    <br>
      
    <span><mark>Inline 1</mark></span>
    <span><mark>Inline 2</mark></span>
    <span><mark>Inline 3</mark></span>
</body>
</html>
